[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catbond"
version = "0.1.0"
description = "Teaching-grade Florida hurricane loss model, cat bond layer analytics and spread regression"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyreadr>=0.5",
]

[project.optional-dependencies]
test = ["pytest>=8", "statsmodels>=0.14", "ruff>=0.5", "openpyxl>=3.1"]
deliverables = ["openpyxl>=3.1", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catbond = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
